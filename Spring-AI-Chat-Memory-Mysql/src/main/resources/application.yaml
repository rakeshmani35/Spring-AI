spring:
  application:
    name: Spring-AI-Chat-Memory-Mysql

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aichatmemory
    username: root
    password: root

  ai:
   openai:
     api-key: ${OPENAI_API_KEY}
   chat:
     memory:
       repository:
         jdbc:
           initialize-schema: ALWAYS




logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG

server:
  port: 9292